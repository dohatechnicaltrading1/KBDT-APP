<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kashinagar Blood Donation Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#a1233b;
  --red-dark:#7a1a2c;
  --red-soft:#f6e4e7;
  --ink:#20232b;
  --ink-soft:#6b7078;
  --paper:#faf8f5;
  --card:#ffffff;
  --line:#eae5df;
  --green:#2f8a4e;
  --yellow:#c98a1f;
  --grey:#9aa0a8;
  --radius:14px;
  --shadow:0 2px 10px rgba(32,35,43,0.06);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; font-family:'Manrope',sans-serif; background:var(--paper); color:var(--ink); font-size:15px;}
.bn-active body{font-family:'Hind Siliguri','Manrope',sans-serif;}
h1,h2,h3,h4{margin:0 0 4px; font-weight:800; letter-spacing:-0.01em;}
p{margin:0;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:15px;}
img{max-width:100%; display:block;}
.hidden{display:none !important;}

#app{max-width:480px; margin:0 auto; min-height:100vh; background:var(--paper); display:flex; flex-direction:column; position:relative;}
.topbar{background:var(--red); color:#fff; padding:16px 18px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:20;}
.topbar .brand{display:flex; align-items:center; gap:10px;}
.topbar .drop{width:26px; height:26px; background:#fff; border-radius:50% 50% 50% 0; transform:rotate(45deg); position:relative; flex:none;}
.topbar .drop::after{content:'';position:absolute; inset:5px; background:var(--red); border-radius:50% 50% 50% 0;}
.topbar h1{font-size:16px; color:#fff; line-height:1.15;}
.topbar .sub{font-size:11px; opacity:.85; font-weight:500;}
.topbar-actions{display:flex; gap:8px; align-items:center;}
.langbtn{background:rgba(255,255,255,.18); border:none; color:#fff; padding:6px 10px; border-radius:20px; font-size:12px; font-weight:700;}
.iconbtn{background:rgba(255,255,255,.18); border:none; color:#fff; width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px;}

main{flex:1; padding:16px 16px 90px; overflow-y:auto;}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:12px; box-shadow:var(--shadow);}
.section-title{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:700; margin:18px 0 8px;}
.stat-row{display:flex; gap:10px;}
.stat{flex:1; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; text-align:center; box-shadow:var(--shadow);}
.stat .num{font-size:22px; font-weight:800; color:var(--red);}
.stat .lbl{font-size:11px; color:var(--ink-soft); margin-top:2px;}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; background:var(--red); color:#fff; border:none; padding:12px 18px; border-radius:10px; font-weight:700; font-size:14px; width:100%;}
.btn:active{background:var(--red-dark);}
.btn.secondary{background:var(--red-soft); color:var(--red-dark);}
.btn.outline{background:transparent; color:var(--red); border:1.5px solid var(--red);}
.btn.small{width:auto; padding:8px 14px; font-size:13px;}
.btn.ghost{background:var(--paper); color:var(--ink); border:1px solid var(--line);}
.btn-row{display:flex; gap:8px;}
.btn[disabled]{opacity:.5;}

.field{margin-bottom:12px;}
.field label{display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:5px;}
.field input, .field select, .field textarea{width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:10px; background:#fff; color:var(--ink);}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--red);}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

.badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px;}
.badge.eligible{background:#e4f4e9; color:var(--green);}
.badge.soon{background:#fbf0dc; color:var(--yellow);}
.badge.not_yet{background:#f0f0f0; color:var(--grey);}
.badge.pending{background:#fbf0dc; color:var(--yellow);}
.badge.approved{background:#e4f4e9; color:var(--green);}
.badge.rejected{background:#fbe4e6; color:var(--red);}

.donor-row{display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--line);}
.donor-row:last-child{border-bottom:none;}
.avatar{width:42px; height:42px; border-radius:50%; background:var(--red-soft); color:var(--red-dark); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; flex:none; overflow:hidden;}
.avatar img{width:100%; height:100%; object-fit:cover;}
.donor-row .info{flex:1; min-width:0;}
.donor-row .name{font-weight:700; font-size:14px;}
.donor-row .meta{font-size:12px; color:var(--ink-soft);}
.bg-tag{background:var(--red); color:#fff; font-size:11px; font-weight:800; padding:2px 7px; border-radius:6px;}

.bottomnav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:#fff; border-top:1px solid var(--line); display:flex; z-index:30; padding:6px 2px calc(6px + env(safe-area-inset-bottom));}
.navitem{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px; background:none; border:none; color:var(--ink-soft); font-size:10px; font-weight:700;}
.navitem .ic{font-size:19px;}
.navitem.active{color:var(--red);}

.auth-wrap{padding:40px 24px 24px; min-height:100vh; display:flex; flex-direction:column;}
.auth-hero{text-align:center; margin-bottom:26px;}
.auth-hero .drop-lg{width:56px; height:56px; background:var(--red); border-radius:50% 50% 50% 0; transform:rotate(45deg); margin:0 auto 18px;}
.auth-hero h1{font-size:21px; color:var(--red-dark);}
.auth-hero p{font-size:13px; color:var(--ink-soft); margin-top:4px;}
.tab-switch{display:flex; background:var(--red-soft); border-radius:12px; padding:4px; margin-bottom:20px;}
.tab-switch button{flex:1; padding:10px; border:none; background:none; border-radius:9px; font-weight:700; font-size:13px; color:var(--red-dark);}
.tab-switch button.active{background:var(--red); color:#fff;}

.tag-pill{display:inline-block; padding:8px 12px; border:1.5px solid var(--line); border-radius:20px; font-size:13px; font-weight:700; margin:0 6px 6px 0; color:var(--ink);}
.tag-pill.active{background:var(--red); color:#fff; border-color:var(--red);}
.pill-row{display:flex; flex-wrap:wrap;}

.toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 18px; border-radius:10px; font-size:13px; z-index:100; box-shadow:0 4px 14px rgba(0,0,0,.25); max-width:90%; text-align:center;}

.empty{text-align:center; padding:30px 10px; color:var(--ink-soft);}
.empty .ic{font-size:34px; margin-bottom:8px;}

.modal-overlay{position:fixed; inset:0; background:rgba(20,20,20,.5); z-index:200; display:flex; align-items:flex-end; justify-content:center;}
.modal{background:#fff; width:100%; max-width:480px; border-radius:18px 18px 0 0; padding:20px; max-height:88vh; overflow-y:auto;}
.modal-handle{width:40px; height:4px; background:var(--line); border-radius:3px; margin:0 auto 16px;}
.modal h3{margin-bottom:14px;}

.list-item-actions{display:flex; gap:6px; margin-top:8px;}
.list-item-actions .btn{width:auto; padding:6px 12px; font-size:12px;}

.gallery-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.gallery-grid img{width:100%; height:110px; object-fit:cover; border-radius:10px;}

.quiz-option{display:block; width:100%; text-align:left; padding:12px 14px; border:1.5px solid var(--line); border-radius:10px; margin-bottom:8px; background:#fff; font-size:14px;}
.quiz-option.selected{border-color:var(--red); background:var(--red-soft);}
.quiz-option.correct{border-color:var(--green); background:#e4f4e9;}
.quiz-option.incorrect{border-color:var(--red); background:#fbe4e6;}

.member-card{display:flex; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line);}
.member-card:last-child{border-bottom:none;}
.member-card .avatar{width:50px; height:50px; font-size:16px;}

.role-badge{font-size:10px; font-weight:800; padding:2px 8px; border-radius:8px; text-transform:uppercase;}
.role-badge.admin{background:#2a2f3a; color:#fff;}
.role-badge.organizer{background:var(--red); color:#fff;}
.role-badge.donor{background:var(--red-soft); color:var(--red-dark);}

.card-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.link-btn{background:none; border:none; color:var(--red); font-weight:700; font-size:13px; padding:0;}

.spinner{width:22px; height:22px; border:3px solid var(--red-soft); border-top-color:var(--red); border-radius:50%; animation:spin .7s linear infinite; margin:20px auto;}
@keyframes spin{to{transform:rotate(360deg);}}

.photocard-preview{background:linear-gradient(135deg,var(--red),var(--red-dark)); color:#fff; border-radius:18px; padding:22px; text-align:center; margin-bottom:14px;}
.photocard-preview .drop-lg{background:#fff;}
.photocard-preview h2{color:#fff; font-size:18px;}
.photocard-preview .num{font-size:32px; font-weight:800; margin:8px 0;}
.photocard-preview .sub{font-size:12px; opacity:.85;}

.announcement{background:#fff7e6; border:1px solid #f0d99b; color:#8a6415; padding:10px 12px; border-radius:10px; font-size:12.5px; margin-bottom:12px;}
</style>
</head>
<body>
<div id="app">
  <div id="toast" class="toast hidden"></div>

  <div id="screen-auth">
    <div class="auth-wrap">
      <button class="langbtn" style="align-self:flex-end; color:var(--red); background:var(--red-soft);" onclick="toggleLang()"><span id="langLabelAuth">বাংলা</span></button>
      <div class="auth-hero">
        <div class="drop-lg"></div>
        <h1 data-i18n="orgName">Kashinagar Blood Donation Team</h1>
        <p data-i18n="tagline">Connecting donors. Saving lives.</p>
      </div>
      <div class="tab-switch">
        <button id="tabLogin" class="active" onclick="switchAuthTab('login')" data-i18n="login">Log In</button>
        <button id="tabSignup" onclick="switchAuthTab('signup')" data-i18n="signup">Sign Up</button>
      </div>

      <div id="loginForm">
        <div class="field">
          <label data-i18n="mobileOrEmailOrUsername">Mobile / Email / Username</label>
          <input id="loginIdentifier" type="text" placeholder="01XXXXXXXXX">
        </div>
        <div class="field">
          <label data-i18n="password">Password</label>
          <input id="loginPassword" type="password" placeholder="••••••••">
        </div>
        <button class="btn" onclick="doLogin()" data-i18n="login">Log In</button>
        <button class="link-btn" style="display:block; margin:14px auto 0;" onclick="openForgotPassword()" data-i18n="forgotPassword">Forgot password?</button>
      </div>

      <div id="signupForm" class="hidden">
        <div class="field"><label data-i18n="fullName">Full Name</label><input id="suName" type="text"></div>
        <div class="two-col">
          <div class="field"><label data-i18n="bloodGroup">Blood Group</label>
            <select id="suBloodGroup"><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>O+</option><option>O-</option><option>AB+</option><option>AB-</option></select>
          </div>
          <div class="field"><label data-i18n="age">Age</label><input id="suAge" type="number"></div>
        </div>
        <div class="field"><label data-i18n="mobile">Mobile Number</label><input id="suMobile" type="text" placeholder="01XXXXXXXXX"></div>
        <div class="field"><label data-i18n="email">Email (optional)</label><input id="suEmail" type="email"></div>
        <div class="two-col">
          <div class="field"><label data-i18n="gender">Gender</label>
            <select id="suGender"><option data-i18n="male">Male</option><option data-i18n="female">Female</option><option data-i18n="other">Other</option></select>
          </div>
          <div class="field"><label data-i18n="password">Password</label><input id="suPassword" type="password"></div>
        </div>
        <div class="field"><label data-i18n="presentAddress">Present Address</label><input id="suPresentAddress" type="text" placeholder="Area, City"></div>
        <div class="field"><label data-i18n="permanentAddress">Permanent Address</label><input id="suPermanentAddress" type="text"></div>
        <button class="btn" onclick="doSignup()" data-i18n="createAccount">Create Account</button>
      </div>
    </div>
  </div>

  <div id="screen-main" class="hidden">
    <div class="topbar">
      <div class="brand">
        <div class="drop"></div>
        <div>
          <h1 id="topbarTitle" data-i18n="orgName">KBDT</h1>
          <div class="sub" id="topbarUserLine">—</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="langbtn" onclick="toggleLang()"><span id="langLabelMain">বাংলা</span></button>
        <button class="iconbtn" onclick="logout()" title="Logout">⎋</button>
      </div>
    </div>
    <main id="mainContent"></main>
    <div class="bottomnav" id="bottomNav"></div>
  </div>

  <div id="modalRoot"></div>
</div>

<script>

function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{

  });
  document.getElementById('langLabelAuth').textContent = STATE.lang==='en' ? 'বাংলা' : 'English';

function api(action, data){
  data = data || {};
  if(STATE.user){ data.requesterId = data.requesterId || STATE.user.id; data.requesterRole = data.requesterRole || STATE.user.role; }
  return fetch(CONFIG.API_URL, {
    method:'POST',
    body: JSON.stringify({ action, data })
  }).then(r=>r.json()).catch(err=>({error:'Network error. Check your connection.'}));
}
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>el.classList.add('hidden'), 2600);
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

function navConfigFor(role){
  if(role==='donor') return [

  ];
  if(role==='organizer') return [
    {id:'dashboard', ic:'⌂', label:'dashboard'}, {id:'donors', ic:'👥', label:'donors'},
    {id:'eligibility', ic:'♥', label:'eligibility'}, {id:'requests', ic:'✉', label:'requests'},
    {id:'more', ic:'≡', label:'more'}
  ];
  return [
    {id:'dashboard', ic:'⌂', label:'dashboard'}, {id:'donors', ic:'👥', label:'donors'},

  ];

function buildNav(){
  const items = navConfigFor(STATE.user.role);

  ).join('');
  renderTab(items[0].id);
}

let currentQuiz = { quizId:null, questions:[], idx:0, score:0 };
async function startQuiz(quizId){
  const res = await api('getQuizQuestions', { quizId });
  currentQuiz = { quizId, questions: res.questions || [], idx:0, score:0 };
  if(!currentQuiz.questions.length){ showToast(t('noDataYet')); return; }
  renderQuizQuestion();
}
function renderQuizQuestion(){
  const q = currentQuiz.questions[currentQuiz.idx];
  const opts = JSON.parse(STATE.lang==='bn' && q.optionsBn && q.optionsBn!=='[]' ? q.optionsBn : q.optionsEn || '[]');
  openModal(`
    <h3>${currentQuiz.idx+1} / ${currentQuiz.questions.length}</h3>
    <p style="font-weight:700; margin-bottom:14px;">${escapeHtml(STATE.lang==='bn' && q.questionBn ? q.questionBn : q.questionEn)}</p>
    ${opts.map((o,i)=>`<button class="quiz-option" onclick="answerQuiz(${i})">${escapeHtml(o)}</button>`).join('')}
  `);
}
function answerQuiz(i){
  const q = currentQuiz.questions[currentQuiz.idx];
  if(Number(q.correctIndex) === i) currentQuiz.score++;
  currentQuiz.idx++;
  if(currentQuiz.idx < currentQuiz.questions.length){ renderQuizQuestion(); }
  else{ finishQuiz(); }
}
async function finishQuiz(){
  await api('submitQuizResult', { quizId: currentQuiz.quizId, userId: STATE.user.id, userName: STATE.user.name, score: currentQuiz.score, totalQuestions: currentQuiz.questions.length });
  openModal(`
    <h3 data-i18n="yourScore">Your Score</h3>
    <p style="font-size:32px; font-weight:800; color:var(--red); text-align:center; margin:20px 0;">${currentQuiz.score} / ${currentQuiz.questions.length}</p>
    <button class="btn" onclick="closeModal()" data-i18n="close">Close</button>
  `);
  applyI18n();
}

async function renderOrgDashboard(){
  const main = document.getElementById('mainContent');
  const [dirRes, reqRes, settingsRes] = await Promise.all([
    api('getFullDonorDirectory', {}), api('getRequestsQueue', {}), api('getSettings', {})
  ]);
  const donors = dirRes.donors || [];
  const totalDonations = donors.reduce((s,d)=>s+(d.totalDonations||0),0);
  const pending = (reqRes.requests||[]).length;
  const bgCounts = {};
  donors.forEach(d=>{ bgCounts[d.bloodGroup] = (bgCounts[d.bloodGroup]||0)+1; });
  main.innerHTML = `
    <div class="stat-row">
      <div class="stat"><div class="num">${donors.length}</div><div class="lbl" data-i18n="totalDonors">Total Donors</div></div>

    </div>

      ${Object.keys(bgCounts).length ? Object.entries(bgCounts).map(([bg,c])=>`
        <div style="display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line); font-size:13px;">

    <h3 data-i18n="addQuestion">Add Question</h3>
    <div class="field"><label>${STATE.lang==='en'?'Question (EN)':'প্রশ্ন (ইংরেজি)'}</label><input id="qQuestionEn"></div>
    <div class="field"><label>${STATE.lang==='en'?'Options (comma separated)':'অপশনসমূহ (কমা দিয়ে আলাদা)'}</label><input id="qOptionsEn" placeholder="Option A, Option B, Option C"></div>
    <div class="field"><label>${STATE.lang==='en'?'Correct option number (1,2,3...)':'সঠিক অপশন নম্বর (১,২,৩...)'}</label><input id="qCorrectIndex" type="number" min="1"></div>
    <button class="btn" onclick="submitAddQuestion('${quizId}')" data-i18n="save">Save</button>
  `);
  applyI18n();
}
async function submitAddQuestion(quizId){
  const questionEn = document.getElementById('qQuestionEn').value.trim();
  const optionsEn = document.getElementById('qOptionsEn').value.split(',').map(s=>s.trim()).filter(Boolean);
  const correctIndex = Number(document.getElementById('qCorrectIndex').value) - 1;
  if(!questionEn || !optionsEn.length) return showToast('Fill all fields');
  const res = await api('addQuestion', { quizId, questionEn, optionsEn, correctIndex });
  if(res.error) return showToast(res.error);
  showToast(STATE.lang==='en'?'Question added':'প্রশ্ন যোগ করা হয়েছে');
  closeModal();
}

async function renderOrganizerMgmt(){
  const res = await api('listOrganizers', {});
  const organizers = res.organizers || [];
  openModal(`
    <h3 data-i18n="manageOrganizers">Manage Organizers</h3>
    <div class="field"><label data-i18n="username">Username</label><input id="orgUsername"></div>
    <div class="field"><label data-i18n="tempPassword">Temporary Password</label><input id="orgTempPassword"></div>
    <button class="btn small" onclick="submitCreateOrganizer()" style="margin-bottom:14px;" data-i18n="addOrganizer">Add Organizer</button>
    ${organizers.map(o=>`
      <div class="donor-row">
        <div class="avatar">${initials(o.name)}</div>
        <div class="info"><div class="name">${escapeHtml(o.name)}</div><div class="meta">${o.isActive===false?t('deactivate'):t('isActive')}</div></div>
        <button class="btn small outline" onclick="deactivateOrg('${o.id}')" data-i18n="deactivate">Deactivate</button>
      </div>
    `).join('') || `<div class="empty">${t('noDataYet')}</div>`}
  `);
  applyI18n();
}
async function submitCreateOrganizer(){
  const username = document.getElementById('orgUsername').value.trim();
  const tempPassword = document.getElementById('orgTempPassword').value;
  if(!username || !tempPassword) return showToast('Fill all fields');
  const res = await api('createOrganizer', { username, tempPassword });
  if(res.error) return showToast(res.error);
  showToast(STATE.lang==='en'?'Organizer created':'অর্গানাইজার তৈরি হয়েছে');
  renderOrganizerMgmt();
}
async function deactivateOrg(organizerId){
  await api('deactivateOrganizer', { organizerId });
  renderOrganizerMgmt();
}

async function renderSettingsView(){
  const res = await api('getSettings', {});
  const s = res.settings || {};
  openModal(`
    <h3 data-i18n="settings">Settings</h3>
    <div class="field"><label data-i18n="orgName">Organization Name</label><input id="stOrgName" value="${escapeAttr(s.orgName||'')}"></div>
    <div class="field"><label data-i18n="facebookPage">Facebook URL</label><input id="stFacebookUrl" value="${escapeAttr(s.facebookUrl||'')}"></div>
    <div class="field"><label data-i18n="orgAnnouncement">Announcement</label><textarea id="stAnnouncement" rows="2">${escapeHtml(s.announcement||'')}</textarea></div>
    <button class="btn" onclick="submitSettings()" data-i18n="save">Save</button>
  `);
  applyI18n();
}
async function submitSettings(){
  const settings = {
    orgName: document.getElementById('stOrgName').value.trim(),
    facebookUrl: document.getElementById('stFacebookUrl').value.trim(),
    announcement: document.getElementById('stAnnouncement').value.trim()
  };
  const res = await api('updateSettings', { settings });
  if(res.error) return showToast(res.error);
  showToast(STATE.lang==='en'?'Settings saved':'সেটিংস সংরক্ষিত হয়েছে');
  closeModal();
}
async function exportCsv(){
  const res = await api('exportDonorsCsv', {});
  if(res.error) return showToast(res.error);
  const blob = new Blob([res.csv], { type:'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'kbdt-donors.csv'; a.click();
}

function initials(name){ return (name||'').split(' ').filter(Boolean).slice(0,2).map(s=>s[0].toUpperCase()).join(''); }
function fmtDate(iso){ if(!iso) return '-'; const d = new Date(iso); return d.toLocaleDateString(STATE.lang==='bn'?'bn-BD':'en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function escapeHtml(str){ if(str===undefined||str===null) return ''; return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(str){ return escapeHtml(str); }

applyI18n();
if(CONFIG.API_URL === 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE'){
  showToast('⚠️ Set CONFIG.API_URL in index.html to your Apps Script Web App URL');
}
if(STATE.user){ enterApp(); }
</script>
</body>
</html>
